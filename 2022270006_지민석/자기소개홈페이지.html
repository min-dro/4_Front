<!DOCTYPE html>
<html>
<head>
    <title>자기소개홈페이지</title>
    <script src="hello.js"></script>
    <link href="style.css">
    <style>
        @import url(style.css);
    </style>
</head>
<body>
    <header>
        <div>
            <h1>안녕하십니까.(클릭하면 색이 바껴요)</h1>
        </div>
    </header>
    <hr>
    <nav>
        <div>
            <p>(혹시 지루해하실까봐 노래도 준비했습니다)</p>
            <audio src="휴대연화(inst.).mp3" controls="controls"></audio>
        </div>
    </nav>
    <section>
        <article>
            <p1>저는 어떤사람이냐면</p1>
            <table border="1">
                <caption>이런사람입니다</caption>
                <thead>
                    <tr>
                        <th colspan="2">자기소개</th>
                    </tr>
                    <tr>
                        <th>이름</th>
                        <th>지민석</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>학교명</td>
                        <td>오산대학교</td>
                    </tr>
                    <tr>
                        <td>학년</td>
                        <td>1학년</td>
                    </tr>
                    <tr>
                        <th rowspan="3">친한친구들</th>
                        <td>이우철</td>
                    </tr>
                    <tr>
                        <td>김준우</td>
                    </tr>
                    <tr>
                        <td>고경민</td>
                    </tr>
                </tbody>
            </table>
        </article>
        <article>
            <ul>
                <li>
                    <b>내가 자주 접속하는 사이트</b>
                    <ol>
                        <div class="button">
                            <li>
                                <a href="https://www.google.co.kr/">구글</a>
                                <img src="google.png" width="50">
                            </li>
                            <li>
                                <a href="https://www.naver.com/">네이버</a>
                                <img src="naver.jpg" width="50">
                            </li>
                        </div>
                    </ol>
                </li>
            </ul>
        </article>
        <article>
            <form>
                <fieldset>
                    <legend>여러분은 탕수육 무슨파인가요?</legend>
                    <label>
                        <input type="radio" name="bumuk" value="1">부먹
                    </label><br>
                    <label>
                        <input type="radio" name="jikmuk" value="2">찍먹
                    </label><br>
                    <label>
                        <input type="radio" namr="gita" value="3">
                        <input type="text" name="text" value="다른거인 분들은 여기에 적으면 됩니다...">
                    </label><br>
                    <select>
                        <option>저는</option>
                        <option>짜장소스에</option>
                        <option>부먹</option>
                        <option>입니다.</option>
                    </select>
                </fieldset>
            </form>
        </article>
    </section>
</body>
</html>
