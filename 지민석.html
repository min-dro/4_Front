<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        body {
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
            justify-content: center;
        }

        form {
            padding: 20px;
             background-color: white;
            max-width: 400px;
            width: 100%;
            border: 2px solid rgb(190, 190, 190);    
                  
        }
        th{
            text-align: left;
        }
        input{
            padding: 1em;

        }
        #address {
            vertical-align: top;
        }
        table{
            border-spacing: 10px;
        }
        button{display: inline-block; width: 10%; border: none; font-weight: 900; font-size: 20px;
        background-color: rgb(164, 252, 156); margin-top: 20px; padding: 1em;  width: 20em;
        text-decoration: none; text-align: center; cursor: pointer; }
    </style>
<body>
    <form>
        <table>
            <tr>
                <th>아이디</th>
                <td><input type="text" id="id" required
                    oninvalid="this.setCustomValidity('필수 입력 항목 입니다')"
                    oninput="this.setCustomValidity('')"></td>
            </tr>
            <tr>
                <th>패스워드</th>
                <td><input type="password" id="password" onclick="password()" required
                    oninvalid="this.setCustomValidity('필수 입력 항목 입니다')"
                    oninput="this.setCustomValidity('')"></td>
            </tr>
            <tr>
                <td></td>
                <td><div id="pwd" onchange="password()"></div></td>
            </tr>
            <tr>
                <th>패스워드 확인</th>
                <td><input type="password" id="passwordcheck" required
                    oninvalid="this.setCustomValidity('필수 입력 항목 입니다')"
                    oninput="this.setCustomValidity('')"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td><input type="email" id="email"></td>
            </tr>
            <tr>
                <th id="address">주소</th>
                <td><input type="text" id="address"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="text" id="id"></td>
            </tr>
        </table>
        <button type="submit">가 입</button>
    </form>
    <script>
        function password() {
            const pwd = document.getElementById("pwd");
            const passwordVal = document.getElementById("password").value;
            
            const regRxp = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^*+=-])(?=.*[0-9]).{8,32}$/;
            if(!regRxp.test(passwordVal)){
                pwd.innerHTML = "영문자 대/소문자 특수문자, 숫자 포함 8 ~ 32자";
            } else {
                pwd.innerHTML = ""
            }
            

        }
        
        document.querySelector('form').addEventListener("submit", function (event) {
        event.preventDefault();
            const regRxp = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^*+=-])(?=.*[0-9]).{8,32}$/;

            if(document.getElementById("password").value !=  document.getElementById("passwordcheck").value){
                alert("잘못 입력되었습니다.");
                return false;
            } else if (document.getElementById("id").value == "" || document.getElementById("password").value == "" || document.getElementById("passwordcheck").value == "") {
                alert("잘못 입력되었습니다.");
                return false;
            } else if (!regRxp.test(document.getElementById("password").value)){
                alert("잘못 입력되었습니다.");
                return false;
            } else {
                return true;
            }

        });
    </script>
</body>
</html>
