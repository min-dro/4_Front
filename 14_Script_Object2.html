<body>
    <h3>* 객체 배열을 사용한 다량의 데이터 관리</h3>
    <button onclick="test6()"></button>
    <div class="area" id="area6"></div>
    <script>
        function test6() {
            const person0 = {name: "이오재", age:31, gender: "남"};
            const person1 = {name: "박미진", age:29, gender: "여"};
            const person2 = {name: "류연우", age:29, gender: "남"};
            const person3 = {name: "이진호", age:30, gender: "남"};
            const person4 = {name: "이동협", age:28, gender: "남"};

            const personArr = [];
            personArr.push(person0);
            personArr.push(person1);
            personArr.push(person2);
            personArr.push(person3);
            personArr.push(person4);

            console.log(personArr);
            // ..
            console.log(personArr[0]);
            console.log(personArr[1]);
            // ..
            // 배열 내의 데이터를 하나씩 출력
            for(let person of personArr) {
                // person 객체의 이름(name)만 출력
                console.log(person.name);
            }
            // 배열 내의 각 객체에 점수(point) 속성을 추가
            personArr[0].point = 0;
            personArr[1].point = 0;
            // ...
            for(let person of personArr) {
                person.point = 0;
            }
            console.log(personArr);
            // 각 객체에 toString() 메소드를 추가
            //  "name: xx, age: xx, gener: xx, point: xx" 반환
            for(let person of personArr){
                person.toString = function() {
                    // ` ${변수나 함수명} 일반 텍스트(문자) `
                    return `name: ${this.name}, age: ${this.age}, gender: ${this.gender}, point: ${this.point}`
                    // return "name: " + this.name + ", age: " + this.age +
                    //     ", gender: " + this.gender + ", point: " + this.point;
                }
            }

            // div 영역에 배열 내의 각 객체 내용을 출력
            const area6 = document.getElementById("area6");

            area6.innerHTML += personArr;

            // for(let person of personArr) {
            //     area6.innerHTML += person + "<br>";
            // }
        }
    </script>
    <hr>
    <h3>* 생성자 함수</h3>
    <p>
        new 키워드를 통해서 객체를 생성할 수 있는 함수를 의미
        (함수명 부분의 첫글자를 대문자로 작성)
    </p>
    <button onclick="test7()">실행</button>
    <div class="area" id="area7"></div>
    <script>
        // 사람 객체에 대한 생성자 함수
        function Person(name, age, gender, point) {
            this.name = name;
            this.age = age;
            this.gender = gender;
            this.point = point;

            this.toString = function() {
                return `name: ${this.name}, age ${this.age}`
                    + `gender: ${this.gender}, point: ${this.point}`;
            }
        }

        function test7() {
            const person0 = new Person("이오재", 31, "남", 0);
                            // {name: "이오재", age 31, gender: "남", point: 0}
            const person1 = new Person("홍길동", 40, "남", 100);

                            document.getElementById("area7").innerHTML = person0;
                            document.getElementById("area7").innerHTML += person1;
        }
    </script>

            // 2024년 2월 21일 날짜로 설정
            const date2 = new Date(2024, 2-1, 21);  // Date(연도, 월-1, 일);

            area8.innerHTML += "종강일: " + date3.getTime() + "<br>";

                    - 1s == 1000ms

            */
           area8.innerHTML += "<hr>";

           area8.innerHTML += "현재(2): " + date2 + "<br>";
           area8.innerHTML += "종강일: " + date3 +"<br>";

           /*
                - 연도 : getFullYear()
                - 월   : getMonth() (+ 1)
                - 일   : getDate()
                - 요일 : getDay()
                - 시   : getHours()
                - 분   : getMinutes()
                - 초   : getSeconds()
           */
          // 종강일에 해당하는 Date 객체(date3)를 기준으로 div 영역에 내용을 출력
        // (2) 요일에 해당 배열을 선언
        const days = ["일", "월", "화", "수", "목", "금", "토"];

          area8.innerHTML += "- 연도 : " + date3.getFullYear() + "<br>";
          area8.innerHTML += "- 월 : " + (date3.getMonth() + 1) + "<br>";
          area8.innerHTML += "- 일 :" + date3.getDate() + "<br>"
        //   area8.innerHTML += "- 요일 : " + date3.getDay() + "<br>"
          area8.innerHTML += "- 시 : " + date3.getHours() + "<br>"
          area8.innerHTML += "- 분 : " + date3.getMinutes() + "<br>"
          area8.innerHTML += "- 초 : " + date3.getSeconds() + "<br>";

          // 날짜 계산
          //  현재 날짜, 종강일 => 남은 일수
          const now = new Date();
          const end = new Date(2024, 6-1, 4);

          area8.innerHTML = "종강일 - 현재날짜 : " + (end - now) + "<br>";
          // 현재날짜부터 종강일까지 밀리세컨드 단위로 계산
          /*
            - 1s == 1000ms == 1 * 1000
            - 1m == (1s * 60) == 1 * 1000 * 60
            - 1h == (1m * 60) == 1 * 1000 * 60 * 60
            - 1d == (1h * 24) == 1 * 1000 * 60 * 60 * 24 
          */
         area8.innerHTML += "남은 일수: " + ((end-now)/(1000*60*60*24)) +"<br>";
        }

    </script>
